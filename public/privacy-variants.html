<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waypoint — privacy variants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --font: "Geist", ui-sans-serif, system-ui, sans-serif;
        --fg: #0a0a0a;
        --mute: #6e6e80;
        --line: rgba(10, 10, 10, 0.1);
        --ghost: rgba(10, 10, 10, 0.06);
        --paper: #fff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body { font-family: var(--font); background: #111; color: var(--fg); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      [hidden] { display: none !important; }
      a { color: inherit; text-decoration: none; }

      .labbar {
        position: sticky; top: 0; z-index: 60;
        display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
        min-height: 48px; padding: 8px 16px;
        background: #111; color: #f4f4f5;
        border-bottom: 1px solid rgba(255,255,255,.08);
        font-size: 13px;
      }
      .labbar strong { font-weight: 500; }
      .labbar .hint { color: rgba(255,255,255,.45); margin-right: auto; }
      .labbar .group { display: flex; align-items: center; gap: 4px; }
      .labbar .group span { color: rgba(255,255,255,.4); margin: 0 6px 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
      .labbar button {
        height: 30px; padding: 0 12px; border: 0; border-radius: 999px;
        background: transparent; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 500;
      }
      .labbar button[aria-current="true"] { background: #fff; color: #111; }
      .labbar kbd { font: 500 11px/1 var(--font); opacity: .45; margin-left: 4px; }

      .stage { position: relative; min-height: calc(100svh - 48px); background: #fff; }

      /* Faded product behind the panel */
      .product {
        pointer-events: none;
        padding: 0 32px 80px;
        filter: grayscale(.15);
      }
      .product header {
        display: flex; align-items: center; justify-content: space-between;
        height: 64px; margin: 0 -32px; padding: 0 32px;
        border-bottom: 1px solid rgba(10,10,10,.08);
      }
      .product .word { font-size: 16px; font-weight: 500; letter-spacing: -.02em; }
      .product h1 {
        max-width: 45rem; margin: 80px auto 16px;
        font-size: clamp(36px, 5vw, 48px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1;
      }
      .product p { max-width: 45rem; margin: 0 auto; color: var(--mute); font-size: 18px; }
      .veil {
        position: absolute; inset: 0;
        background: rgba(255,255,255,.55);
        pointer-events: none;
      }

      .panel {
        position: absolute; top: 0; right: 0; bottom: 0;
        width: min(80vw, 920px);
        background: var(--paper);
        border-left: 1px solid var(--line);
        display: flex; flex-direction: column;
        box-shadow: -24px 0 60px rgba(0,0,0,.04);
      }
      .full .veil { display: none; }
      .full .panel {
        position: relative; width: 100%; border: 0; box-shadow: none;
        min-height: calc(100svh - 48px);
      }

      .p-head {
        display: flex; align-items: flex-start; gap: 12px;
        padding: 20px 32px 18px;
        border-bottom: 1px solid var(--line);
      }
      .p-head h1 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; line-height: 1.2; }
      .p-head p { margin: 6px 0 0; color: var(--mute); font-size: 14px; font-weight: 500; }
      .icon-btn {
        width: 32px; height: 32px; margin-top: 2px;
        border: 0; border-radius: 999px; background: transparent;
        font-size: 18px; line-height: 1;
      }
      .p-body { flex: 1; overflow: auto; padding: 28px 32px 40px; }
      .p-foot {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 10px 32px;
        border-top: 1px solid var(--line);
        color: var(--mute); font-size: 12px; font-weight: 500;
      }
      .p-foot button { border: 0; background: none; color: var(--mute); font-weight: 500; padding: 0; }

      .btn {
        height: 36px; padding: 0 20px; border: 0; border-radius: 40px;
        font-size: 14px; font-weight: 500;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .btn-solid { background: var(--fg); color: #fff; }
      .btn-solid:disabled { opacity: .28; cursor: not-allowed; }
      .btn-ghost { background: var(--ghost); color: var(--fg); }
      .btn-text { height: auto; padding: 0; background: none; color: var(--fg); border-radius: 0; font-size: 14px; }

      .meta-row {
        display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px;
        margin-bottom: 28px; font-size: 14px; font-weight: 500; color: var(--mute);
      }

      .group { margin: 0 0 36px; }
      .group h2 { margin: 0 0 4px; font-size: 13px; font-weight: 500; color: var(--mute); }
      .group .desc { margin: 0 0 12px; font-size: 13px; color: var(--mute); }

      .row {
        display: grid; grid-template-columns: 1fr auto; gap: 8px 24px;
        padding: 18px 0;
        border-top: 1px solid var(--line);
        align-items: start;
      }
      .row strong { display: block; font-size: 16px; font-weight: 500; letter-spacing: -.015em; }
      .row em { display: block; margin-top: 4px; font-style: normal; font-size: 14px; color: var(--mute); line-height: 1.45; }
      .row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding-top: 2px; }
      .pending { font-size: 12px; font-weight: 500; color: var(--fg); }

      .switch {
        width: 44px; height: 26px; border: 0; border-radius: 99px;
        background: #d6d6dc; position: relative; transition: background 160ms;
      }
      .switch[aria-checked="true"] { background: var(--fg); }
      .switch i {
        position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
        border-radius: 50%; background: #fff; display: block;
        transition: transform 160ms;
      }
      .switch[aria-checked="true"] i { transform: translateX(18px); }
      .req { font-size: 12px; font-weight: 500; color: var(--mute); padding-top: 4px; }

      .sticky-cta {
        position: sticky; bottom: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        margin: 24px -32px -40px; padding: 16px 32px 20px;
        background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28%);
        font-size: 14px; font-weight: 500;
      }

      /* Index variant — news-list settings */
      .index-row {
        display: block; padding: 22px 0;
        border-top: 1px solid var(--line);
      }
      .index-row h3 { margin: 0 0 8px; font-size: 17.7px; font-weight: 500; letter-spacing: -.01em; }
      .index-row .meta { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; font-size: 14px; font-weight: 500; }
      .index-row .meta .mute { color: var(--mute); }

      /* Now (current) comparison */
      .now-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
      .now-card .hd { padding: 12px 16px; background: #f7f7f8; border-bottom: 1px solid var(--line); }
      .now-card .hd h2 { margin: 0; font-size: 13px; font-weight: 600; }
      .now-card .hd p { margin: 2px 0 0; font-size: 12px; color: var(--mute); }
      .now-row { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
      .now-row:first-of-type { border-top: 0; }
      .now-row.will { background: #eff6ff; }
      .badge { display: inline-flex; height: 20px; padding: 0 8px; border-radius: 8px; background: #f4f4f5; font-size: 12px; font-weight: 500; }

      /* Review */
      .change { padding: 20px 0; border-top: 1px solid var(--line); }
      .change h3 { margin: 0 0 6px; font-size: 17px; font-weight: 500; letter-spacing: -.015em; }
      .change .delta { margin: 0 0 8px; font-size: 14px; font-weight: 500; }
      .change p { margin: 0; font-size: 14px; color: var(--mute); line-height: 1.5; }

      .facts { display: grid; gap: 0; margin-top: 36px; }
      .fact {
        display: grid; grid-template-columns: 1fr auto; gap: 8px 24px;
        padding: 20px 0; border-top: 1px solid var(--line);
      }
      .fact strong { font-size: 16px; font-weight: 500; }
      .fact p { margin: 4px 0 0; font-size: 14px; color: var(--mute); max-width: 36rem; line-height: 1.45; }
      .fact .state { font-size: 13px; font-weight: 500; white-space: nowrap; padding-top: 2px; }
      .fact .state.ok { color: var(--fg); }
      .fact .state.wait { color: var(--mute); }

      .hold {
        position: relative; overflow: hidden;
        width: 100%; height: 44px; margin-top: 8px;
        border: 1px solid var(--line); border-radius: 40px;
        background: #fff; font-size: 14px; font-weight: 500;
        user-select: none;
      }
      .hold .fill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: var(--ghost);
        transition: width 120ms linear;
      }
      .hold.holding .fill { width: 100%; transition-duration: 1200ms; }
      .hold.done { background: var(--fg); color: #fff; border-color: var(--fg); }
      .hold.done .fill { display: none; }
      .hold span { position: relative; }

      .apply-wrap { margin-top: 28px; }

      .split {
        display: grid; gap: 48px;
      }
      @media (min-width: 840px) {
        .split { grid-template-columns: 1.15fr .85fr; align-items: start; }
        .split .approval { position: sticky; top: 24px; }
      }

      .ritual {
        max-width: 40rem; margin: 0 auto; padding: 48px 0 80px;
      }
      .kicker { display: flex; gap: 16px; margin: 0 0 20px; font-size: 14px; font-weight: 500; }
      .kicker time { color: var(--mute); }
      .ritual h1 { font-size: clamp(36px, 5vw, 48px); font-weight: 500; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 16px; }
      .ritual .lede { font-size: 18px; color: var(--mute); margin: 0 0 40px; line-height: 1.5; }

      @media (max-width: 800px) {
        .panel { width: 100%; border-left: 0; }
        .p-head, .p-body, .p-foot { padding-left: 20px; padding-right: 20px; }
        .sticky-cta { margin-left: -20px; margin-right: -20px; padding-left: 20px; padding-right: 20px; }
        .product { display: none; }
        .veil { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="labbar">
      <strong>Privacy</strong>
      <span class="hint">proposte · stesso stato, sei pelli</span>
      <div class="group">
        <span>Settings</span>
        <button type="button" data-screen="settings-quiet">Quiet <kbd>1</kbd></button>
        <button type="button" data-screen="settings-index">Index <kbd>2</kbd></button>
        <button type="button" data-screen="settings-now">Now <kbd>3</kbd></button>
      </div>
      <div class="group">
        <span>Accept</span>
        <button type="button" data-screen="review-quiet">Quiet <kbd>4</kbd></button>
        <button type="button" data-screen="review-split">Split <kbd>5</kbd></button>
        <button type="button" data-screen="review-ritual">Ritual <kbd>6</kbd></button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="product" aria-hidden="true">
        <header>
          <span class="word">Waypoint</span>
          <span class="btn btn-ghost" style="pointer-events:none">Privacy settings</span>
        </header>
        <h1>Where do you want to go next?</h1>
        <p>Plan a flexible trip while keeping control of how the service uses your data.</p>
      </div>
      <div class="veil"></div>
      <aside class="panel" id="panel"></aside>
    </div>

    <script>
      const optional = {
        recommendations: { on: false, pending: true, label: "Recommendations", purpose: "Suggest destinations and itineraries based on travel preferences.", effect: "Destination and itinerary suggestions will be generic.", from: "On", to: "Off" },
        location: { on: true, pending: false, label: "Location suggestions", purpose: "Suggest nearby places during a trip.", effect: "Nearby place suggestions will no longer be available.", from: "On", to: "Off" },
        partner: { on: false, pending: true, label: "Partner advertising", purpose: "Tailor advertising from selected travel partners.", effect: "Partner offers will no longer be personalised.", from: "On", to: "Off" },
      };
      const required = [
        { label: "Trip fulfilment", purpose: "Create, manage, and complete the trips you book." },
        { label: "Account security", purpose: "Detect suspicious access and protect the demo account." },
        { label: "Transactional updates", purpose: "Send confirmations, schedule changes, and essential trip notices." },
      ];

      let human = false;
      let holding = false;
      let holdTimer = null;
      let screenId = "settings-quiet";

      const pendingCount = () => Object.values(optional).filter((s) => s.pending).length;
      const optionalOn = () => Object.values(optional).filter((s) => s.on).length;

      function switchBtn(key) {
        const s = optional[key];
        return `<button type="button" class="switch" role="switch" aria-checked="${s.on}" aria-label="${s.label}" data-key="${key}"><i></i></button>`;
      }

      function pendingMark(key) {
        const s = optional[key];
        if (!s.pending) return "";
        return `<span class="pending">Will turn ${s.on ? "on" : "off"}</span>`;
      }

      function changesList() {
        return Object.values(optional).filter((s) => s.pending).map((s) => `
          <article class="change">
            <h3>${s.label}</h3>
            <p class="delta">${s.from} → ${s.to}</p>
            <p>${s.effect}</p>
          </article>
        `).join("");
      }

      function holdControl() {
        const label = human ? "Human confirmation recorded" : holding ? "Keep holding…" : "Hold to confirm";
        return `
          <button type="button" class="hold ${human ? "done" : holding ? "holding" : ""}" data-hold="1" ${human ? "disabled" : ""}>
            <span class="fill"></span>
            <span>${label}</span>
          </button>
        `;
      }

      function applyBtn() {
        return `<button type="button" class="btn btn-solid" data-apply="1" ${human ? "" : "disabled"} style="width:100%">Apply changes</button>`;
      }

      function facts() {
        return `
          <div class="facts" aria-label="Approval status">
            <div class="fact">
              <div>
                <strong>Agent</strong>
                <p>The page tool prepared this exact change set. It is a recorded preparation, not a signature.</p>
              </div>
              <span class="state ok">Prepared</span>
            </div>
            <div class="fact">
              <div>
                <strong>Human</strong>
                <p>Hold for 1.2 seconds to record that you reviewed this plan. Early release does not confirm.</p>
                ${holdControl()}
              </div>
              <span class="state ${human ? "ok" : "wait"}">${human ? "Recorded" : "Waiting"}</span>
            </div>
          </div>
        `;
      }

      const screens = {
        "settings-quiet": {
          full: false,
          html() {
            return `
              <div class="p-head">
                <div>
                  <h1>Privacy settings</h1>
                  <p>All data-use settings available for this site.</p>
                </div>
              </div>
              <div class="p-body">
                <div class="meta-row">
                  <span>${optionalOn()} of 3 optional settings on · Revision 4</span>
                  <button type="button" class="btn-text">Previous changes (2)</button>
                </div>
                <section class="group">
                  <h2>Essential services</h2>
                  <p class="desc">Needed to provide booked trips and protect your account.</p>
                  ${required.map((r) => `
                    <div class="row">
                      <div><strong>${r.label}</strong><em>${r.purpose}</em></div>
                      <span class="req">Required</span>
                    </div>
                  `).join("")}
                </section>
                <section class="group">
                  <h2>Personalisation</h2>
                  <p class="desc">Controls experiences adapted to your interests.</p>
                  <div class="row">
                    <div><strong>${optional.recommendations.label}</strong><em>${optional.recommendations.purpose}</em></div>
                    <div class="side">${pendingMark("recommendations")}${switchBtn("recommendations")}</div>
                  </div>
                </section>
                <section class="group">
                  <h2>Location</h2>
                  <p class="desc">Controls features that use your precise location.</p>
                  <div class="row">
                    <div><strong>${optional.location.label}</strong><em>${optional.location.purpose}</em></div>
                    <div class="side">${pendingMark("location")}${switchBtn("location")}</div>
                  </div>
                </section>
                <section class="group">
                  <h2>Partner offers</h2>
                  <p class="desc">Controls tailored offers from selected partners.</p>
                  <div class="row">
                    <div><strong>${optional.partner.label}</strong><em>${optional.partner.purpose}</em></div>
                    <div class="side">${pendingMark("partner")}${switchBtn("partner")}</div>
                  </div>
                </section>
                <div class="sticky-cta">
                  <span>${pendingCount() ? pendingCount() + " pending changes" : "No pending changes"}</span>
                  <button type="button" class="btn btn-solid" data-goto="review-quiet" ${pendingCount() ? "" : "disabled"}>Review changes</button>
                </div>
              </div>
              <div class="p-foot"><span>Agent access available · Stored in this browser</span><button type="button">Reset</button></div>
            `;
          },
        },
        "settings-index": {
          full: false,
          html() {
            const rows = [
              ...required.map((r) => ({ title: r.label, a: "Required", b: "Essential" })),
              { title: optional.recommendations.label, a: optional.recommendations.pending ? `Will turn ${optional.recommendations.on ? "on" : "off"}` : (optional.recommendations.on ? "On" : "Off"), b: "Optional" },
              { title: optional.location.label, a: optional.location.on ? "On" : "Off", b: "Optional" },
              { title: optional.partner.label, a: optional.partner.pending ? `Will turn ${optional.partner.on ? "on" : "off"}` : (optional.partner.on ? "On" : "Off"), b: "Optional" },
            ];
            return `
              <div class="p-head">
                <div>
                  <h1>Privacy settings</h1>
                  <p>Every setting, in one list.</p>
                </div>
              </div>
              <div class="p-body">
                <div class="meta-row">
                  <span>${optionalOn()} of 3 optional on</span>
                  <button type="button" class="btn-text">Previous changes</button>
                </div>
                ${rows.map((r) => `
                  <a class="index-row" href="#">
                    <h3>${r.title}</h3>
                    <p class="meta"><span>${r.a}</span><span class="mute">${r.b}</span></p>
                  </a>
                `).join("")}
                <div class="sticky-cta">
                  <span>${pendingCount()} pending changes</span>
                  <button type="button" class="btn btn-solid" data-goto="review-quiet">Review changes</button>
                </div>
              </div>
              <div class="p-foot"><span>Agent access available · Stored in this browser</span><button type="button">Reset</button></div>
            `;
          },
        },
        "settings-now": {
          full: false,
          html() {
            return `
              <div class="p-head">
                <div>
                  <h1>Privacy settings</h1>
                  <p>All data-use settings available for this site.</p>
                </div>
              </div>
              <div class="p-body">
                <div class="meta-row">
                  <span>${optionalOn()} of 3 optional settings on · Revision 4</span>
                  <button type="button" class="btn-text">Previous changes (2)</button>
                </div>
                <section class="now-card">
                  <div class="hd"><h2>Essential services</h2><p>Needed to provide booked trips and protect your account.</p></div>
                  ${required.map((r) => `<div class="now-row"><div style="flex:1"><strong style="font-size:14px">${r.label}</strong><div style="color:var(--mute);font-size:13px;margin-top:2px">${r.purpose}</div></div><span class="req">Required</span></div>`).join("")}
                </section>
                <section class="now-card">
                  <div class="hd"><h2>Personalisation</h2><p>Controls experiences adapted to your interests.</p></div>
                  <div class="now-row ${optional.recommendations.pending ? "will" : ""}">
                    <div style="flex:1"><strong style="font-size:14px">${optional.recommendations.label}</strong> ${optional.recommendations.pending ? '<span class="badge">Will turn off</span>' : ""}<div style="color:var(--mute);font-size:13px;margin-top:2px">${optional.recommendations.purpose}</div></div>
                    ${switchBtn("recommendations")}
                  </div>
                </section>
                <section class="now-card">
                  <div class="hd"><h2>Location</h2><p>Controls features that use your precise location.</p></div>
                  <div class="now-row">
                    <div style="flex:1"><strong style="font-size:14px">${optional.location.label}</strong><div style="color:var(--mute);font-size:13px;margin-top:2px">${optional.location.purpose}</div></div>
                    ${switchBtn("location")}
                  </div>
                </section>
                <section class="now-card">
                  <div class="hd"><h2>Partner offers</h2><p>Controls tailored offers from selected partners.</p></div>
                  <div class="now-row ${optional.partner.pending ? "will" : ""}">
                    <div style="flex:1"><strong style="font-size:14px">${optional.partner.label}</strong> ${optional.partner.pending ? '<span class="badge">Will turn off</span>' : ""}<div style="color:var(--mute);font-size:13px;margin-top:2px">${optional.partner.purpose}</div></div>
                    ${switchBtn("partner")}
                  </div>
                </section>
                <div class="sticky-cta" style="border:1px solid var(--line);border-radius:14px;margin:16px 0 0;padding:16px;background:#fff">
                  <span>${pendingCount()} pending changes</span>
                  <button type="button" class="btn btn-solid" data-goto="review-quiet">Review changes</button>
                </div>
              </div>
              <div class="p-foot"><span>Agent access available · Stored in this browser</span><button type="button">Reset</button></div>
            `;
          },
        },
        "review-quiet": {
          full: false,
          html() {
            return `
              <div class="p-head">
                <button type="button" class="icon-btn" data-goto="settings-quiet" aria-label="Back">←</button>
                <div>
                  <h1>Review changes</h1>
                  <p>Two facts, then apply. Only the settings below will change.</p>
                </div>
              </div>
              <div class="p-body">
                ${changesList()}
                ${facts()}
                <div class="apply-wrap">${applyBtn()}</div>
              </div>
              <div class="p-foot"><span>Agent access available · Stored in this browser</span><button type="button">Reset</button></div>
            `;
          },
        },
        "review-split": {
          full: false,
          html() {
            return `
              <div class="p-head">
                <button type="button" class="icon-btn" data-goto="settings-quiet" aria-label="Back">←</button>
                <div>
                  <h1>Review changes</h1>
                  <p>The list is the effect. The column is the approval.</p>
                </div>
              </div>
              <div class="p-body">
                <div class="split">
                  <div>${changesList()}</div>
                  <div class="approval">
                    <h2 style="margin:0 0 8px;font-size:13px;font-weight:500;color:var(--mute)">Approval</h2>
                    ${facts()}
                    <div class="apply-wrap">${applyBtn()}</div>
                  </div>
                </div>
              </div>
              <div class="p-foot"><span>Agent access available · Stored in this browser</span><button type="button">Reset</button></div>
            `;
          },
        },
        "review-ritual": {
          full: true,
          html() {
            return `
              <div class="p-body">
                <article class="ritual">
                  <p class="kicker"><time>12 Sep 2026</time><span>Privacy</span></p>
                  <h1>Accept these changes</h1>
                  <p class="lede">Agent preparation and human review are different facts. Both stay visible. Apply reads the stored state back before a receipt exists.</p>
                  ${changesList()}
                  ${facts()}
                  <div class="apply-wrap">${applyBtn()}</div>
                  <p style="margin-top:28px;font-size:13px;color:var(--mute);font-weight:500">This records a deliberate in-page confirmation, not identity or a legal signature.</p>
                </article>
              </div>
            `;
          },
        },
      };

      function render() {
        const spec = screens[screenId];
        const stage = document.getElementById("stage");
        const panel = document.getElementById("panel");
        stage.classList.toggle("full", spec.full);
        panel.innerHTML = spec.html();
        document.querySelectorAll(".labbar button[data-screen]").forEach((btn) => {
          btn.setAttribute("aria-current", btn.dataset.screen === screenId ? "true" : "false");
        });
        history.replaceState(null, "", "#" + screenId);
      }

      function show(id) {
        if (!screens[id]) return;
        if (!id.startsWith("review")) {
          human = false;
          holding = false;
          clearTimeout(holdTimer);
        }
        screenId = id;
        render();
      }

      document.querySelector(".labbar").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-screen]");
        if (btn) show(btn.dataset.screen);
      });

      document.getElementById("panel").addEventListener("click", (e) => {
        const go = e.target.closest("[data-goto]");
        if (go) { show(go.dataset.goto); return; }
        const sw = e.target.closest(".switch");
        if (sw) {
          const key = sw.dataset.key;
          optional[key].on = !optional[key].on;
          optional[key].pending = !optional[key].pending;
          optional[key].to = optional[key].on ? "On" : "Off";
          optional[key].from = optional[key].on ? "Off" : "On";
          render();
        }
      });

      function startHold(btn) {
        if (human || holdTimer) return;
        holding = true;
        btn.classList.add("holding");
        holdTimer = setTimeout(() => {
          holdTimer = null;
          holding = false;
          human = true;
          render();
        }, 1200);
      }
      function cancelHold() {
        if (human) return;
        clearTimeout(holdTimer);
        holdTimer = null;
        holding = false;
        const btn = document.querySelector("[data-hold]");
        if (btn) btn.classList.remove("holding");
      }

      document.getElementById("panel").addEventListener("pointerdown", (e) => {
        const btn = e.target.closest("[data-hold]");
        if (!btn || e.button !== 0) return;
        startHold(btn);
      });
      document.getElementById("panel").addEventListener("pointerup", cancelHold);
      document.getElementById("panel").addEventListener("pointerleave", (e) => {
        if (e.target.closest && e.target.closest("[data-hold]")) cancelHold();
      });
      document.getElementById("panel").addEventListener("click", (e) => {
        if (e.target.closest("[data-apply]") && human) {
          e.target.closest("[data-apply]").textContent = "Applied · receipt would open";
        }
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.matches("input, textarea")) return;
        const map = { "1": "settings-quiet", "2": "settings-index", "3": "settings-now", "4": "review-quiet", "5": "review-split", "6": "review-ritual" };
        if (map[e.key]) show(map[e.key]);
      });

      const start = (location.hash || "#settings-quiet").slice(1);
      show(screens[start] ? start : "settings-quiet");
    </script>
  </body>
</html>
